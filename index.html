<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Raíces que se cuentan | Travel Tech Ecosystem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<header>
    <div class="logo">Raíces que se cuentan</div>
    <nav>
        <a onclick="show('explorar')">Explorar</a>
        <a onclick="show('itinerario')">Itinerario</a>
        <a onclick="show('gastos')">Gastos</a>
        <a onclick="show('nosotros')">Nosotros</a>
        <a onclick="show('contacto')">Contacto</a>
    </nav>
</header>

<section id="explorar" class="active">
    <div class="card">
        <h2 class="title-font">Nueva Planificación</h2>
        <div class="grid-plan">
            <select id="pSel" onchange="loadProv()"><option value="">Selecciona País</option></select>
            <select id="prSel" onchange="loadDist()"><option value="">Provincia</option></select>
            <select id="dSel"><option value="">Distrito</option></select>
        </div>
        <div class="grid-plan">
            <input type="date" id="tDate">
            <input type="number" id="tDays" placeholder="Días de estancia">
            <select id="tAir">
                <option value="">Aerolínea</option>
                <option>LATAM</option><option>Aerolíneas Argentinas</option><option>Iberia</option>
            </select>
        </div>
        <button class="btn-gold" onclick="saveNewTrip()">GUARDAR PLAN Y MARCAR PIN DORADO</button>
    </div>
    
    <div class="card" id="infoPanel" style="display:none;">
        <h4 id="infoTitle" style="color:var(--accent);">Guía del País</h4>
        <div class="grid-plan" style="grid-template-columns: repeat(3, 1fr); margin-top:15px;">
            <button class="btn-gold small" onclick="rinkuInfo('historia')">Historia</button>
            <button class="btn-gold small" onclick="rinkuInfo('arquitectura')">Arquitectura</button>
            <button class="btn-ar" onclick="launchAR()"><i class="fa-solid fa-cube"></i> AR</button>
        </div>
    </div>

    <div class="card" id="arContainer" style="display:none;">
        <model-viewer id="view3D" camera-controls auto-rotate shadow-intensity="1" src="" ar></model-viewer>
        <button class="btn-gold" onclick="closeAR()">Cerrar Visor</button>
    </div>

    <div id="map"></div>
</section>

<section id="itinerario">
    <h1 class="title-font">Bitácoras de Viaje</h1>
    <div id="itinList"></div>
</section>

<section id="gastos">
    <div class="expense-hero">
        <p class="overline">PRESUPUESTO CONSOLIDADO</p>
        <h2 id="totalUSD" class="display-price">$ 0.00</h2>
        <div class="currency-grid">
            <div class="curr-item"><small>SOLES (PEN)</small><br><b id="v-pen">0</b></div>
            <div class="curr-item"><small>P. ARG (ARS)</small><br><b id="v-ars">0</b></div>
            <div class="curr-item"><small>EURO (EUR)</small><br><b id="v-eur">0</b></div>
        </div>
    </div>
</section>

<div id="rinku-bot">
    <div class="rinku-chat" id="rinkuChat">
        <h4>Rinku AI 🐒</h4>
        <div id="chatContent" class="chat-body">¡Hola! Soy Rinku. Pregúntame sobre Garibaldi o el Puente de la Mujer.</div>
        <input type="text" id="chatInput" placeholder="Escribe tu ruta o duda...">
        <button class="btn-gold" onclick="rinkuAsk()">Consultar</button>
    </div>
    <img src="https://img.icons8.com/clouds/100/monkey.png" class="rinku-icon" onclick="toggleRinku()">
</div>

<script src="script.js"></script>
</body>
</html>
